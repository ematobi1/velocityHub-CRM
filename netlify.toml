[build]
  base = "frontend/"
  command = "npm run build"
  publish = "build/"

[build.environment]
  NODE_VERSION = "22"
  REACT_APP_API_URL = "https://velocityhub-api.up.railway.app/api"
  REACT_APP_SOCKET_URL = "https://velocityhub-api.up.railway.app"
  CI = "false"

# React Router — all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
