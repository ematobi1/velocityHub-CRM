# Netlify Configuration for VelocityHub CRM Frontend

[build]
  # Directory with the frontend source code
  base = "frontend/"

  # Build command
  command = "npm run build"

  # Directory to publish (output of build)
  publish = "build/"

# Redirect all routes to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables (will be set in Netlify dashboard)
# These are just placeholders - actual values set in Netlify UI
[build.environment]
  NODE_VERSION = "22"
  REACT_APP_API_URL = "https://velocityhub-api.onrender.com/api"
  REACT_APP_SOCKET_URL = "https://velocityhub-api.onrender.com"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
