name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @anthropic-ai/sdk

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }} > pr.diff
          echo "diff_size=$(wc -c < pr.diff)" >> $GITHUB_OUTPUT

      - name: Run AI review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/review.js

      - name: Post status check
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_RESULT: ${{ steps.review.outputs.result }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$REVIEW_RESULT" = "blocked" ]; then
            STATE="failure"
            DESCRIPTION="AI review found critical issues — merge blocked"
          elif [ "$REVIEW_RESULT" = "warned" ]; then
            STATE="success"
            DESCRIPTION="AI review passed with warnings"
          else
            STATE="success"
            DESCRIPTION="AI review passed"
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/$REPO/statuses/$SHA \
            -f state="$STATE" \
            -f description="$DESCRIPTION" \
            -f context="ai-code-review" \
            -f target_url="https://github.com/$REPO/pull/${{ github.event.pull_request.number }}"
